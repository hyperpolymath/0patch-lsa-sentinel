# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for 0patch-lsa-sentinel.
# Scoped strictly to ecosystems actually present in this repository:
#   * github-actions (/.github/workflows)
#   * cargo (/host-rust)

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/host-rust"
    schedule:
      interval: "weekly"
    # `open-pull-requests-limit: 0` suppresses routine version-update PRs
    # while leaving Dependabot SECURITY PRs flowing (host-rust currently has
    # zero runtime dependencies).
    open-pull-requests-limit: 0
