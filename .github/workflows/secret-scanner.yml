# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets) in metadatastician/standards.
#
# Deliberately passes NO `secrets:` block (standards#1108 §6b): gitleaks runs
# as a pinned local binary and needs only `contents: read`.
name: "Secret Scanner"

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@d3e4b485a2af90c92a8e18af0888cd19cb132cd9
    permissions:
      contents: read
