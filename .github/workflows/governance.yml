# SPDX-License-Identifier: MPL-2.0
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@d3e4b485a2af90c92a8e18af0888cd19cb132cd9
    permissions:
      actions: read
      contents: read
      security-events: write
