# SPDX-License-Identifier: MPL-2.0
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 1 * *'   # monthly 1st 06:00 UTC (Actions burn cut, standards#288)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-actions:
    name: CodeQL Analysis (actions)
    uses: metadatastician/standards/.github/workflows/codeql-reusable.yml@d3e4b485a2af90c92a8e18af0888cd19cb132cd9
    with:
      language: actions
      build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write

  codeql-rust:
    name: CodeQL Analysis (rust)
    uses: metadatastician/standards/.github/workflows/codeql-reusable.yml@d3e4b485a2af90c92a8e18af0888cd19cb132cd9
    with:
      language: rust
      build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
