# Tooling configuration for 0patch-lsa-sentinel (mise-en-place).
# Every tool name below resolves in `mise registry`; builds are orchestrated
# via `Justfile` (`just --list`). SPARK (`gnatprove` / `gprbuild`) and Idris2
# (`idris2`) are provided by the host OS / Alire / pack toolchain rather than
# mise.

[settings]
lockfile = true

[tools]
rust = "latest"
zig = "0.15.2"
just = "latest"
shfmt = "latest"
